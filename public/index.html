<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="container">
<header class="header"><div><p class="eyebrow">PERSONAL FINANCE</p><h1>Expense Tracker</h1><p class="subtitle">A simple place to keep track of your spending.</p></div></header>
<section class="summary"><p>Total expenses</p><strong id="total">₹0.00</strong><small id="count">0 transactions</small></section>
<section class="panel"><h2>Add an expense</h2><form id="expense-form">
<label>Title<input id="title" name="title" placeholder="e.g. Lunch" maxlength="80" required></label>
<label>Amount (₹)<input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="250.00" required></label>
<label>Category<select id="category" name="category" required><option value="">Choose category</option><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Education</option><option>Other</option></select></label>
<button type="submit">+ Add expense</button><p id="message" role="status" aria-live="polite"></p></form></section>
<section class="panel"><div class="list-heading"><h2>Recent expenses</h2><span id="list-count">0 items</span></div><div class="table-wrap"><table><thead><tr><th>Expense</th><th>Category</th><th>Date</th><th class="amount-col">Amount</th><th></th></tr></thead><tbody id="expense-list"><tr><td colspan="5" class="empty">No expenses yet. Add your first expense above.</td></tr></tbody></table></div></section>
<footer></footer></main><script src="/app.js"></script></body></html>
